spring:
  application:
    name: rag-poc

  datasource:
    url: jdbc:postgresql://locahost:5432/ragdb
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3-4b
      embedding:
        model: nomic-embed-text
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        distance-type: cosine_distance
        index-type: hnsw
